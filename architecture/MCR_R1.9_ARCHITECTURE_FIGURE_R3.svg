<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="1240" height="1010" font-family="Segoe UI, Arial, sans-serif">
<title>MCR R1.9 architecture with evidence status</title>
<desc>Mission plane, context/assurance inputs, capability plane, probabilistic boundary, deterministic MCR, provider and execution planes, outcome assurance and mission transitions. Each element carries an evidence-status tag (PROVEN, OBSERVED, PARTIAL, SYNTHETIC, DEFERRED) encoded by border style, fill pattern and text.</desc>
