# MCR 3.0 offline quality gates. No enterprise secrets, no network calls to SAP or any provider, read-only token.
# Heavy qualification (mutation, verifier attacks) is a separate manual tier below.
name: mcr3-offline
on:
  pull_request:
  push:
    branches: [main, "work/mcr3*"]
  workflow_dispatch:
    inputs:
      qualification:
        description: "also run the heavy qualification tier (mutation + verifier attacks)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mcr3-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: offline gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: validators (9+ suites, sequential)
        run: python tools/mcr3/run_mcr3_tests.py
      - name: results reproduce the archived evidence
        run: python tools/mcr3/run_mcr3_tests.py --check-dir evidence/mcr3
      - name: hash integrity, frozen history, tree secret scan (self-attesting unless an anchor is set)
        run: python tools/mcr3/verify_mcr3.py --fast
      - name: hash integrity against an external anchor (only if the repository variable MCR3_SUMS_ANCHOR is set)
        if: ${{ vars.MCR3_SUMS_ANCHOR != '' }}
        run: python tools/mcr3/verify_mcr3.py --fast --expect-sums-sha256 "${{ vars.MCR3_SUMS_ANCHOR }}"
      - name: Git history credential-shape scan
        run: python tools/mcr3/scan_history_mcr3.py
  qualification:
    name: heavy qualification tier (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: mutation check (bounded concurrency)
        run: python tools/mcr3/run_mcr3_mutation_check.py --jobs 2
      - name: verifier attack suite (sequential)
        run: python tools/mcr3/run_mcr3_verifier_attacks.py
