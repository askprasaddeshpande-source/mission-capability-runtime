# MCR 3.0 release qualification gate. Dispatch this workflow on the exact candidate commit; the check named
# "release gate" on that commit is the only thing that may be read as "heavy qualification passed".
# It fails (it never skips to success) unless: every mutation target passed, the verifier attack suite passed against
# THIS commit, and the checksum manifest matches the externally held anchor (repository variable MCR3_SUMS_ANCHOR).
# No secrets, no network access to any provider, read-only token.
name: mcr3-release-gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcr3-release-gate-${{ github.sha }}
  cancel-in-progress: false
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  mutation:
    name: mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        module: [mcr3_model.py, mcr3_authority.py, mcr3_scan.py, mcr3_chain.py, mcr3_readback.py, mcr3_provenance.py, evc1.py, mini_jsonschema.py, mcr3_adapters.py, mcr3_lineage.py, mcr3_interop.py]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography==46.0.4" "jsonschema==4.26.0"
      - name: mutation check, one module, bounded concurrency
        run: python tools/mcr3/run_mcr3_mutation_check.py --only ${{ matrix.module }} --jobs 2 --out "mutation-${{ matrix.module }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-${{ matrix.module }}.json
          if-no-files-found: error
  attacks:
    name: verifier attack suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography==46.0.4" "jsonschema==4.26.0"
      - name: attack suite (sequential)
        run: python tools/mcr3/run_mcr3_verifier_attacks.py > attacks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: attacks
          path: attacks.json
          if-no-files-found: error
  anchor:
    name: external checksum anchor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: anchor must be configured and must match
        env:
          ANCHOR: ${{ vars.MCR3_SUMS_ANCHOR }}
        run: |
          if [ -z "$ANCHOR" ]; then echo "BLOCKED_EXTERNAL_ANCHOR: repository variable MCR3_SUMS_ANCHOR is not set (owner action)"; exit 1; fi
          python tools/mcr3/verify_mcr3.py --fast --require-clean --expect-sums-sha256 "$ANCHOR"
  release-gate:
    name: release gate
    needs: [mutation, attacks, anchor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: every prerequisite job must have SUCCEEDED (skipped, cancelled or failed is not a pass)
        env:
          MUT: ${{ needs.mutation.result }}
          ATT: ${{ needs.attacks.result }}
          ANC: ${{ needs.anchor.result }}
        run: |
          echo "mutation=$MUT attacks=$ATT anchor=$ANC"
          [ "$MUT" = "success" ] && [ "$ATT" = "success" ] && [ "$ANC" = "success" ]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: gate-artifacts
      - name: decide from the artifacts, for exactly this commit
        run: |
          mkdir flat
          for d in gate-artifacts/*; do cp "$d"/*.json flat/; done
          python tools/mcr3/check_release_gate.py --dir flat --sha "${{ github.sha }}" --out release-gate-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: release-gate-result
          path: release-gate-result.json
