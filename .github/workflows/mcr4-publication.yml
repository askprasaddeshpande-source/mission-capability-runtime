name: MCR4 independent publication integrity
on:
  push:
    branches:
      - publication/mcr4-v1.0.2-release
permissions:
  contents: read
jobs:
  verify:
    name: verify-publication
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout independent history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact preprint, licenses, historical negative evidence and orphan root
        run: python tools/verify_publication.py
